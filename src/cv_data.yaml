profile:
  en: "University teacher and Ph.D. candidate in Computer Science at UBA, with more than ten years of teaching experience across undergraduate and graduate courses. I am currently a doctoral fellow and work at the Applied Artificial Intelligence Lab on computational models of eye movements during visual search in natural scenes. My academic profile combines sustained teaching activity with research in Machine Learning, Bayesian modeling, and computational neuroscience."
  es: "Docente universitario y doctorando en Ciencias de la Computación en la UBA, con más de diez años de experiencia docente en materias de grado y posgrado. Actualmente soy becario doctoral de CONICET y trabajo en el Laboratorio de Inteligencia Artificial Aplicada sobre modelos computacionales de movimientos oculares durante tareas de búsqueda visual en escenas naturales. Mi perfil académico combina una actividad docente sostenida con investigación en Machine Learning, modelado bayesiano y neurociencia computacional."


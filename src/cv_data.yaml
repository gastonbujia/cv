  - id: "professional_experience"
    section: "professional"
    title:
      en: "Research Data Scientist"
      es: "Research Data Scientist"
    company:
      en: "Everything ALS"
      es: "Everything ALS"
    period:
      en: "March 2024 - Present"
      es: "Marzo 2024 - Actualidad"
    highlights:
      en:
        - "Research Data Scientist working on data-driven analysis in the context of amyotrophic lateral sclerosis."
      es:
        - "Research Data Scientist trabajando en análisis orientado por datos en el contexto de esclerosis lateral amiotrófica."
    industry_highlights:
      en:
        - "Developed a dysarthria severity scoring model using Whisper (HuggingFace Transformers), PyTorch, and scikit-learn; the model is deployed in production and integrated into clinical trial workflows."
        - "Built CNN and transformer-based predictive models on accelerometer and voice signals for disease progression monitoring in ALS patients."
        - "Applied survival analysis with Kaplan-Meier curves and Cox proportional hazards models using lifelines and statsmodels to study medication impact and time-to-event outcomes."
        - "Collaborated directly with clinical scientists to translate research requirements into ML solutions for complex clinical datasets."
      es:
        - "Desarrollo de un modelo de scoring de severidad de disartria usando Whisper (HuggingFace Transformers), PyTorch y scikit-learn; el modelo está desplegado en producción e integrado a flujos de ensayos clínicos."
        - "Construcción de modelos predictivos basados en CNNs y transformers sobre señales de acelerómetro y voz para monitoreo de progresión de enfermedad en pacientes con esclerosis lateral amiotrófica."
        - "Aplicación de análisis de supervivencia con curvas Kaplan-Meier y modelos de riesgos proporcionales de Cox usando lifelines y statsmodels para estudiar impacto de medicación y outcomes time-to-event."
        - "Colaboración directa con científicos clínicos para traducir requerimientos de investigación en soluciones de ML sobre datasets clínicos complejos."


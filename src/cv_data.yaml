  - id: "graduate_researcher"
    section: "research"
    title:
      en: "Graduate Researcher"
      es: "Investigador en Formación"
    company:
      en: "Applied Artificial Intelligence Lab (UBA-CONICET)"
      es: "Laboratorio de Inteligencia Artificial Aplicada (UBA-CONICET)"
    period:
      en: "2018 - Present"
      es: "2018 - Actualidad"
    highlights:
      en:
        - "**Doctoral work:** computational models of eye movements and visual search in natural scenes under the supervision of Dr. Juan Kamienkowski."
        - "**Funding:** CONICET internal doctoral fellowship (2018 - 2024)."
        - "Research interests include Machine Learning, computational neuroscience, eye tracking, deep learning, and Bayesian modeling."
      es:
        - "**Trabajo doctoral:** modelos computacionales de movimientos oculares y búsqueda visual en escenas naturales bajo la dirección del Dr. Juan Kamienkowski."
        - "**Financiamiento:** beca interna doctoral CONICET (2018 - 2024)."
        - "Intereses de investigación en Machine Learning, neurociencia computacional, eye tracking, deep learning y modelado bayesiano."
    industry_highlights:
      en:
        - "Designed and evaluated end-to-end ML pipelines for predicting sequential human behavior from real experimental datasets, combining deep learning, Bayesian modeling, CNN-based saliency models, and reproducible analysis workflows."
        - "Contributed to **ViSioNS** (NeurIPS 2022), an open-source benchmark for evaluating computational models, analogous to model evaluation frameworks used in production ML."
        - "Developed **sIBS**, a probabilistic visual-search model combining Bayesian inference and saliency maps, published in *Frontiers in Systems Neuroscience*."
      es:
        - "Diseño y evaluación de pipelines end-to-end de ML para predecir comportamiento humano secuencial sobre datos experimentales reales, combinando deep learning, modelado bayesiano, modelos de saliencia basados en CNNs y flujos reproducibles de análisis."
        - "Contribución a **ViSioNS** (NeurIPS 2022), benchmark open source para evaluar modelos computacionales, análogo a frameworks de evaluación de modelos usados en ML productivo."
        - "Desarrollo de **sIBS**, modelo probabilístico de búsqueda visual que combina inferencia bayesiana y mapas de saliencia, publicado en *Frontiers in Systems Neuroscience*."


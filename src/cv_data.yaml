  profile:
    en: "Data Scientist with a strong background in mathematics, machine learning, and applied research. I combine hands-on experience building and shipping predictive models, including a production-deployed clinical scoring system, with doctoral training in computational modeling, Bayesian methods, and deep learning. I am especially interested in roles where rigorous quantitative thinking, Python-based analysis, and clear communication can turn complex data into actionable decisions."
    es: "Data Scientist con formación sólida en matemática, machine learning e investigación aplicada. Combino experiencia construyendo y desplegando modelos predictivos, incluido un sistema de scoring clínico en producción, con entrenamiento doctoral en modelado computacional, métodos bayesianos y deep learning. Me interesan especialmente roles donde el pensamiento cuantitativo riguroso, el análisis en Python y la comunicación clara permitan transformar datos complejos en decisiones accionables."
